name: Deploy Azarashi 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Prepare website
        run: |
          mkdir -p dist
          unzip -q azarashi-denko-class1-2026.zip -d dist
          if [ ! -f dist/index.html ]; then
            echo "ZIP内にindex.htmlが見つかりません"
            find dist -name index.html
            exit 1
          fi
  

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
