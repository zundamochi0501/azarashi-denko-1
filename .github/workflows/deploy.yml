name: Deploy Azarashi 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      
      - name: Prepare website
        run: |
  mkdir -p dist
  curl -fL --retry 3 -o app.zip https://github.com/zundamochi0501/azarashi-denko-1/releases/download/v1.1/denko1_fix_20261027.zip
  unzip -q app.zip -d dist
  test -f dist/index.html
  

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
